<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>caseparser in the browser</title>
    <!-- No bundler needed: the import map tells the browser where "caseparser" lives -->
    <script type="importmap">
      {
        "imports": {
          "caseparser": "https://cdn.jsdelivr.net/npm/caseparser@4/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <pre id="output"></pre>
    <script type="module" src="./main.js"></script>
  </body>
</html>
